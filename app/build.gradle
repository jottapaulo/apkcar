plugins {
    id 'com.android.application'
}

android {
    namespace 'br.app.btplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'br.app.btplayer'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
